services:
  # ----------------------------------------------------------------------------
  # StockMind-AI Backend API & Real-Time AI Inference Gateway
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stockmind_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
      - DATABASE_TYPE=${DATABASE_TYPE:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./database/stockmind.db}
      - MARKET_DATA_MODE=${MARKET_DATA_MODE:-REPLAY}
      - MARKET_DATA_PROVIDER=${MARKET_DATA_PROVIDER:-REPLAY}
    volumes:
      - ./backend:/app/backend
      - ./ai_engine:/app/ai_engine
      - ./data:/app/data
      - ./database:/app/database
      - ./models:/app/models
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - stockmind_network

  # ----------------------------------------------------------------------------
  # StockMind-AI Streamlit Institutional Terminal
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: stockmind_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    environment:
      - BACKEND_API_URL=http://backend:8000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stockmind_network

  # ----------------------------------------------------------------------------
  # Optional: PostgreSQL Database (For dedicated relational deployment)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: stockmind_postgres
    restart: unless-stopped
    profiles: ["with-postgres"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockmind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockmind_password}
      POSTGRES_DB: ${POSTGRES_DB:-stockmind_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockmind_user} -d ${POSTGRES_DB:-stockmind_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stockmind_network

  # ----------------------------------------------------------------------------
  # Optional: Redis Cache & Event Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: stockmind_redis
    restart: unless-stopped
    profiles: ["with-redis"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - stockmind_network

networks:
  stockmind_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
